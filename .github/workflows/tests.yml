name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch first so pip does not pull the CUDA build
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[server,test,bench]"
      # The model-loading tests (HF comparison, engine, server) download weights and
      # take several minutes; run them locally with `python -m pytest`.
      - run: >
          python -m pytest -q
          tests/test_block_manager.py tests/test_scheduler.py tests/test_sampler.py
          tests/test_config.py tests/test_paged_attention.py tests/test_cuda_graphs.py
