[project]
name = "minivllm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "safetensors",
    "tokenizers",
    "transformers>=4.45",
    "huggingface_hub",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minivllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU; skipped otherwise",
]
